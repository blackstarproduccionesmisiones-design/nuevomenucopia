<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Menú Digital</title>
    <link rel="manifest" href="manifest.json">
    <style>
        :root { --primary-color: #e67e22; --secondary-color: #27ae60; --bg-color: #f9f9f9; }
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: var(--bg-color); margin: 0; padding: 0; color: #333; }
        
        /* Banner del Local */
        .banner { background: #2c3e50; color: white; padding: 30px 20px; text-align: center; }
        .banner h1 { margin: 0; font-size: 2rem; color: #fff; }
        .banner-img { max-width: 100%; height: 200px; object-fit: cover; border-radius: 8px; margin-top: 15px; display: none; box-shadow: 0 4px 6px rgba(0,0,0,0.2); }

        /* Video Promocional */
        .video-container { max-width: 800px; margin: 20px auto; padding: 0 15px; text-align: center; }
        .video-container video { width: 100%; max-height: 400px; border-radius: 8px; border: none; }

        /* Carrusel de Categorías */
        .categorias-carrusel { display: flex; overflow-x: auto; gap: 10px; padding: 15px; background: white; white-space: nowrap; box-shadow: 0 2px 5px rgba(0,0,0,0.05); position: sticky; top: 0; z-index: 100; }
        .categoria-btn { background: #f1f2f6; border: none; padding: 8px 16px; border-radius: 20px; cursor: pointer; font-weight: bold; color: #57606f; transition: 0.3s; flex-shrink: 0; }
        .categoria-btn.active, .categoria-btn:hover { background: var(--primary-color); color: white; }

        /* Contenedor de Productos */
        .menu-container { max-width: 900px; margin: 20px auto; padding: 0 15px; display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 20px; }
        .producto-card { background: #fff; padding: 15px; border-radius: 10px; box-shadow: 0 4px 6px rgba(0,0,0,0.05); display: flex; flex-direction: column; justify-content: space-between; }
        .producto-imagen { width: 100%; height: 160px; object-fit: cover; border-radius: 6px; cursor: pointer; transition: transform 0.2s; }
        .producto-imagen:hover { transform: scale(1.02); }
        .producto-info h3 { margin: 10px 0 5px 0; color: #2c3e50; font-size: 1.2rem; }
        .producto-info p { font-size: 0.9rem; color: #7f8c8d; margin: 0 0 10px 0; }
        .producto-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
        .producto-precio { font-weight: bold; color: var(--secondary-color); font-size: 1.2rem; }
        .btn-agregar { background: var(--secondary-color); color: white; border: none; padding: 8px 12px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .btn-agregar:hover { background: #219653; }

        /* Botón flotante del Carrito */
        .cart-float { position: fixed; bottom: 20px; right: 20px; background: var(--primary-color); color: white; padding: 12px 20px; border-radius: 50px; cursor: pointer; font-weight: bold; box-shadow: 0 4px 10px rgba(0,0,0,0.3); z-index: 1000; }

        /* Modales */
        #modal-imagen { display: none; position: fixed; z-index: 2000; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.8); justify-content: center; align-items: center; }
        #modal-imagen img { max-width: 90%; max-height: 90%; border-radius: 8px; }
        #modal-checkout { display: none; position: fixed; z-index: 2000; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); justify-content: center; align-items: center; }
        .modal-content { background: white; padding: 25px; border-radius: 10px; width: 90%; max-width: 400px; }
        .modal-content input { width: 100%; padding: 10px; margin: 10px 0; border: 1px solid #ccc; border-radius: 5px; box-sizing: border-box; }
        .modal-content button { width: 100%; background: #27ae60; color: white; border: none; padding: 10px; border-radius: 5px; font-weight: bold; cursor: pointer; margin-top: 10px; }
    </style>
</head>
<body>

    <!-- 1. Banner Principal con Nombre y Portada -->
    <div class="banner">
        <h1 id="nombre-local">Cargando local...</h1>
        <p>¡Hacé tu pedido online por WhatsApp!</p>
        <img id="banner-img" class="banner-img" alt="Portada del Local">
    </div>

    <!-- 2. Video Promocional -->
    <div class="video-container">
    <video controls autoplay muted loop>
        <source src="https://videos.pexels.com/video-files/5907436/5907436-hd_1920_1080_25fps.mp4" type="video/mp4">
        Tu navegador no soporta videos.
    </video>
</div>

    <!-- 3. Carrusel de Categorías -->
    <div class="categorias-carrusel" id="carrusel-categorias">
        <button class="categoria-btn active" onclick="filtrarCategoria('todos')">Todos</button>
    </div>

    <!-- Lista de Productos -->
    <div class="menu-container" id="lista-productos">
        <p style="text-align: center; grid-column: 1/-1;">Cargando menú...</p>
    </div>

    <!-- Botón Carrito -->
    <div class="cart-float" onclick="abrirCheckout()">🛒 Ver Carrito (<span id="cart-count">0</span>)</div>

    <!-- Modal Imagen Ampliada -->
    <div id="modal-imagen" onclick="cerrarImagen()">
        <img id="img-ampliada" src="" alt="Imagen ampliada">
    </div>

    <!-- Modal Checkout -->
    <div id="modal-checkout">
        <div class="modal-content">
            <h3>Finalizar Pedido</h3>
            <p>Ingresa tus datos para registrarte y enviar el pedido por WhatsApp:</p>
            <input type="text" id="cliente-nombre" placeholder="Tu Nombre Completo" required>
            <input type="tel" id="cliente-telefono" placeholder="Tu Teléfono / WhatsApp" required>
            <button onclick="enviarPedidoWhatsApp()">Enviar Pedido por WhatsApp</button>
            <button onclick="cerrarCheckout()" style="background: #e74c3c; margin-top: 5px;">Cancelar</button>
        </div>
    </div>

    <script>
        const URL_APPS_SCRIPT = "https://script.google.com/macros/s/AKfycbzsf3LRgBKqsQk93dFJhuJzq-imq85TtNiPp8voWoVNwJvf5Pqr5pdI-oIs5EtXpYE7/exec";
        let productosGlobal = [];
        let carrito = [];

        fetch(URL_APPS_SCRIPT)
            .then(response => response.json())
            .then(data => {
                if (data.ajustes) {
                    // Lee exactamente NOMBRE_LOCAL de tu hoja
                    const nombreLocal = data.ajustes.NOMBRE_LOCAL || "Mi Menú Digital";
                    document.getElementById('nombre-local').innerText = nombreLocal;

                    // Lee exactamente IMAGEN_PORTADA de tu hoja
                    const portadaUrl = data.ajustes.IMAGEN_PORTADA;
                    if (portadaUrl) {
                        const bannerImg = document.getElementById('banner-img');
                        bannerImg.src = portadaUrl;
                        bannerImg.style.display = 'block';
                    }
                }

                productosGlobal = data.productos || [];
                renderCategorias(data.categorias || []);
                renderProductos(productosGlobal);
            })
            .catch(error => {
                console.error('Error al cargar datos:', error);
                document.getElementById('lista-productos').innerHTML = '<p style="text-align: center; color: red; grid-column: 1/-1;">Error al cargar el menú.</p>';
            });

        function renderCategorias(categorias) {
            const carrusel = document.getElementById('carrusel-categorias');
            categorias.forEach(cat => {
                const btn = document.createElement('button');
                btn.className = 'categoria-btn';
                btn.innerText = cat.nombre;
                btn.onclick = () => {
                    document.querySelectorAll('.categoria-btn').forEach(b => b.classList.remove('active'));
                    btn.classList.add('active');
                    filtrarCategoria(cat.id);
                };
                carrusel.appendChild(btn);
            });
        }

        function renderProductos(productos) {
            const contenedor = document.getElementById('lista-productos');
            contenedor.innerHTML = '';
            if (productos.length === 0) {
                contenedor.innerHTML = '<p style="text-align: center; grid-column: 1/-1;">No hay productos disponibles.</p>';
                return;
            }
            productos.forEach(prod => {
                const card = document.createElement('div');
                card.className = 'producto-card';
                card.innerHTML = `
                    <div>
                        <img src="${prod.imagen || 'https://via.placeholder.com/150'}" class="producto-imagen" onclick="ampliarImagen('${prod.imagen || ''}')" alt="${prod.nombre}">
                        <div class="producto-info">
                            <h3>${prod.nombre}</h3>
                            <p>${prod.descripcion || ''}</p>
                        </div>
                    </div>
                    <div class="producto-footer">
                        <span class="producto-precio">$${prod.precio}</span>
                        <button class="btn-agregar" onclick="agregarAlCarrito('${prod.id}')">Agregar</button>
                    </div>
                `;
                contenedor.appendChild(card);
            });
        }

        function filtrarCategoria(catId) {
            if (catId === 'todos') {
                renderProductos(productosGlobal);
            } else {
                const filtrados = productosGlobal.filter(p => String(p.categoria_id) === String(catId));
                renderProductos(filtrados);
            }
        }

        function ampliarImagen(url) {
            if(!url) return;
            document.getElementById('img-ampliada').src = url;
            document.getElementById('modal-imagen').style.display = 'flex';
        }

        function cerrarImagen() {
            document.getElementById('modal-imagen').style.display = 'none';
        }

        function agregarAlCarrito(idProd) {
            const producto = productosGlobal.find(p => String(p.id) === String(idProd));
            if(producto) {
                carrito.push(producto);
                document.getElementById('cart-count').innerText = carrito.length;
                alert(`¡Agregado al carrito: ${producto.nombre}!`);
            }
        }

        function abrirCheckout() {
            if(carrito.length === 0) {
                alert('Tu carrito está vacío.');
                return;
            }
            document.getElementById('modal-checkout').style.display = 'flex';
        }

        function cerrarCheckout() {
            document.getElementById('modal-checkout').style.display = 'none';
        }

        function enviarPedidoWhatsApp() {
            const nombre = document.getElementById('cliente-nombre').value.trim();
            const telefono = document.getElementById('cliente-telefono').value.trim();

            if(!nombre || !telefono) {
                alert('Por favor completa tu nombre y teléfono.');
                return;
            }

            // Registrar cliente automáticamente en la solapa Clientes
            fetch(URL_APPS_SCRIPT, {
                method: 'POST',
                body: JSON.stringify({ nombre: nombre, telefono: telefono })
            }).catch(err => console.log('Error registrando cliente:', err));

            let mensaje = `*¡Nuevo Pedido!*%0A%0A*Cliente:* ${nombre}%0A*Teléfono:* ${telefono}%0A%0A*Detalle del pedido:*%0A`;
            let total = 0;

            carrito.forEach((item, index) => {
                mensaje += `${index + 1}. ${item.nombre} - $${item.precio}%0A`;
                total += Number(item.precio);
            });

            mensaje += `%0A*Total a pagar: $${total}*`;

            const numeroWhatsApp = "3764561004";
            const urlWa = `https://wa.me/549${numeroWhatsApp}?text=${mensaje}`;
            
            cerrarCheckout();
            window.open(urlWa, '_blank');
        }
    </script>
</body>
</html>
